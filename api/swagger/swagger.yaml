# complex objects have schema definitions
definitions:
  ServiceHealth:
    type: object
    additionalProperties: false
    required:
      - status
      - database
      - communicationIndexes
      - privatePictureLibrary
    properties:
      status:
        type: string
        enum:
          - ok
          - degraded
      database:
        type: string
        enum:
          - connected
          - disconnected
      communicationIndexes:
        type: string
        enum:
          - pending
          - building
          - ready
          - failed
      privatePictureLibrary:
        type: string
        description: Reports only whether Azure credentials are present; no secret or endpoint is exposed.
        enum:
          - configured
          - unconfigured
  CommunicationSavedPhraseSyncRequest:
    type: object
    additionalProperties: false
    required:
      - phrases
    properties:
      phrases:
        type: array
        maxItems: 100
        items:
          $ref: "#/definitions/CommunicationSavedPhrase"
  CommunicationSavedPhraseSyncResponse:
    type: object
    required:
      - acceptedCount
      - conflictCount
      - conflictedPhraseIds
      - phrases
      - deletedPhraseIds
      - deletedPhrases
    properties:
      acceptedCount:
        type: integer
      conflictCount:
        type: integer
      conflictedPhraseIds:
        type: array
        maxItems: 100
        items:
          type: string
      phrases:
        type: array
        maxItems: 100
        items:
          $ref: "#/definitions/CommunicationSavedPhrase"
      deletedPhraseIds:
        type: array
        maxItems: 100
        items:
          type: string
      deletedPhrases:
        type: array
        maxItems: 100
        items:
          $ref: "#/definitions/CommunicationSavedPhraseTombstone"
  CommunicationSavedPhraseDeleteRequest:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      phraseIds:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 200
      deleteAll:
        type: boolean
  CommunicationSavedPhraseDeleteResponse:
    type: object
    required:
      - deletedCount
      - deletedPhraseIds
      - deletedPhrases
    properties:
      deletedCount:
        type: integer
      deletedPhraseIds:
        type: array
        maxItems: 100
        items:
          type: string
      deletedPhrases:
        type: array
        maxItems: 100
        items:
          $ref: "#/definitions/CommunicationSavedPhraseTombstone"
  CommunicationSavedPhrase:
    type: object
    additionalProperties: false
    required:
      - id
      - sentence
      - output
      - usageCount
      - createdAt
      - lastUsedAt
      - updatedAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 200
      sentence:
        type: string
        minLength: 1
        maxLength: 500
      output:
        type: array
        maxItems: 50
        items:
          $ref: "#/definitions/CommunicationSavedPhraseOutputItem"
      usageCount:
        type: integer
        minimum: 0
      contractVersion:
        type: integer
        minimum: 1
      createdAt:
        type: integer
        format: int64
        minimum: 1
      lastUsedAt:
        type: integer
        format: int64
        minimum: 1
      updatedAt:
        type: integer
        format: int64
        minimum: 1
      baseVersion:
        type: integer
        minimum: 0
      serverVersion:
        type: integer
        minimum: 1
      conflicted:
        type: boolean
  CommunicationSavedPhraseOutputItem:
    type: object
    additionalProperties: false
    required:
      - label
    properties:
      id:
        type: string
        maxLength: 200
      label:
        type: string
        maxLength: 160
      image:
        type: string
        maxLength: 1000
        pattern: '^https://'
      source:
        type: string
        maxLength: 80
      attribution:
        $ref: "#/definitions/CommunicationPictogramAttribution"
  CommunicationSavedPhraseTombstone:
    type: object
    additionalProperties: false
    required:
      - id
      - deletedAt
      - deletedBy
      - serverVersion
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 200
      deletedAt:
        type: integer
        format: int64
        minimum: 1
      deletedBy:
        type: string
        minLength: 1
        maxLength: 200
      serverVersion:
        type: integer
        minimum: 1
  CommunicationPrivateLibraryMetadata:
    type: object
    additionalProperties: false
    required:
      - format
      - contractVersion
      - size
      - sha256
      - createdAt
      - updatedAt
    properties:
      format:
        type: string
        enum:
          - picinterpreter-private-picture-library-encrypted
      contractVersion:
        type: integer
        enum:
          - 2
      size:
        type: integer
        minimum: 1
        maximum: 20971520
      sha256:
        type: string
        pattern: '^[a-f0-9]{64}$'
      createdAt:
        type: integer
        format: int64
        minimum: 1
      updatedAt:
        type: integer
        format: int64
        minimum: 1
  CommunicationPrivateLibraryDeleteResponse:
    type: object
    additionalProperties: false
    required:
      - deleted
    properties:
      deleted:
        type: boolean
  CommunicationPrivateDeviceDataMetadata:
    type: object
    additionalProperties: false
    required:
      - format
      - contractVersion
      - size
      - sha256
      - createdAt
      - updatedAt
    properties:
      format:
