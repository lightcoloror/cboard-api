swagger: "2.0"
info:
  description: "Cboard API provides backend functionality and persistence to the Cboard application"
  version: "0.0.1"
  title: Cboard API
  termsOfService: "https://www.cboard.io/terms-of-use/"
# basePath prefixes all resource paths 
basePath: /
schemes:
  # tip: remove http to make production-grade
  - http
  - https
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: |
     For accessing the API a valid JWT token must be passed in all the queries in
     the 'Authorization' header.  
     A valid JWT token is generated by the API and retourned as answer of a call
     to the route /login giving a valid user & password.
     The following syntax must be used in the 'Authorization' header :
         Bearer xxxxxx.yyyyyyy.zzzzzz
# format of bodies a client can send (Content-Type)
consumes:
  - application/json
# format of the responses to the client (Accepts)
produces:
  - application/json
parameters:
  AnalyticsReport:
    name: report
    in: body
    description: Analytics data to be requested to Google analytics 
    required: true
    schema:
      $ref: "#/definitions/AnalyticsReport"
  Board:
    name: board
    in: body
    description: Board data for creating a new custom board 
    required: true
    schema:
      $ref: "#/definitions/Board" 
  Communicator:
    name: communicator
    in: body
    description: Communicator data for creating a new custom communicator
    required: true
    schema:
      $ref: "#/definitions/Communicator" 
  CommunicatorIdempotencyKey:
    name: Idempotency-Key
    in: header
    description: Optional stable client-side communicator id used to safely replay create requests for the authenticated user
    required: false
    type: string
    minLength: 1
    maxLength: 64
    pattern: '^[A-Za-z0-9_-]+$'
  LanguageParameter:
    in: query
    name: lang
    type: string
    default: ""
    description: Language option in format xx-XX (e.g. en-US)
  LimitParameter:
    in: query
    name: limit
    type: integer
    default: 0
    description: The numbers of items to return
  Media:
    name: file
    in: formData
    type: file
    description: The files to upload.
    required: true
  CommunicationAacImportFile:
    name: file
    in: formData
    type: file
    description: One Snap .sps/.spb or TouchChat .ce AAC file, at most 20 MiB; the API converts it transiently and does not persist it.
    required: true
  CommunicationAacImportFormat:
    name: format
    in: query
    type: string
    enum:
      - snap
      - touchchat
    description: Source AAC file format.
    required: true
  CommunicationAacImportLocale:
    name: locale
    in: query
    type: string
    default: zh-CN
    pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})?$'
    description: Fallback locale used when the imported page has no locale.
    required: false
  PrivatePictureLibraryArchive:
    name: file
    in: formData
    type: file
    description: A client-side encrypted PicInterpreter private picture-library envelope. The server stores ciphertext only and cannot recover the password or plaintext pictures.
    required: true
  PrivateDeviceDataArchive:
    name: file
    in: formData
    type: file
    description: A client-side encrypted PicInterpreter complete device-data envelope. The server stores ciphertext only and cannot recover the password or plaintext.
    required: true
  OffsetParameter:
    in: query
    name: offset
    type: integer
    default: 0
    description: The number of items to skip before starting to collect the result set
  PageParameter:
    in: query
    name: page
    type: integer
    default: 1
    description: Page
  SearchParameter:
    in: query
    name: search
    type: string
    default: ""
    description: Search by
  Settings:
    name: settings
    in: body
    description: Partial mutable settings patch. Identity fields are controlled by the authenticated user.
    required: true
    schema:
      $ref: "#/definitions/Settings" 
  SortParameter:
    in: query
    name: sort
    type: string
    default: "-_id"
    description: Sort by
  Translate:
    name: translate
    in: body
    description: Translate data 
    required: true
    schema:
      $ref: "#/definitions/Translate" 
  PictogramSearch:
    name: pictogramSearch
    in: body
    description: Missing words to search in configured AAC symbol providers
    required: true
    schema:
      $ref: "#/definitions/PictogramSearch"
  CommunicationSentenceRequest:
    name: communicationSentenceRequest
    in: body
    description: Bounded pictogram labels and optional recent local context
    required: true
    schema:
      $ref: "#/definitions/CommunicationSentenceRequest"
  CommunicationResegmentRequest:
    name: communicationResegmentRequest
    in: body
    description: Caregiver-approved text and local pictogram vocabulary for AI resegmentation
    required: true
    schema:
      $ref: "#/definitions/CommunicationResegmentRequest"
  CommunicationPictogramGenerationRequest:
    name: communicationPictogramGenerationRequest
    in: body
    description: One caregiver-reviewed missing concept for an AI pictogram draft
    required: true
    schema:
      $ref: "#/definitions/CommunicationPictogramGenerationRequest"
  CommunicationSpeechRequest:
    name: communicationSpeechRequest
    in: body
    description: Bounded patient-approved text for transient server-side speech synthesis
    required: true
    schema:
      $ref: "#/definitions/CommunicationSpeechRequest"
  CommunicationDialectNormalizationRequest:
    name: communicationDialectNormalizationRequest
    in: body
    description: Caregiver-reviewed dialect text and optional bounded pictogram vocabulary
    required: true
    schema:
      $ref: "#/definitions/CommunicationDialectNormalizationRequest"
  CommunicationDialectAsrAudio:
    name: audio
    in: formData
    description: One transient caregiver-approved audio file, at most 60 seconds and 3 MiB; CBoard does not persist it
    required: true
    type: file
  CommunicationOcrImage:
    name: image
    in: formData
    description: One transient JPEG, PNG, or WebP image for OCR; the API does not persist it
    required: true
    type: file
  CommunicationPictogramMetadataImage:
    name: image
    in: formData
    description: One transient caregiver-approved JPEG, PNG, or WebP image used only to suggest editable pictogram metadata
    required: true
    type: file
  CommunicationBackgroundRemovalImage:
    name: image
    in: formData
    description: One transient caregiver-approved JPEG, PNG, or WebP image; the original is not persisted
    required: true
    type: file
  CommunicationReceiverRecordSyncRequest:
    name: communicationReceiverRecordSyncRequest
    in: body
    description: Bounded confirmed receiver records; drafts and maintenance logs are excluded
    required: true
    schema:
      $ref: "#/definitions/CommunicationReceiverRecordSyncRequest"
  CommunicationReceiverRecordDeleteRequest:
    name: communicationReceiverRecordDeleteRequest
    in: body
    description: Selected confirmed receiver record ids, or deleteAll for an explicit full clear
    required: true
    schema:
      $ref: "#/definitions/CommunicationReceiverRecordDeleteRequest"
  CommunicationSavedPhraseSyncRequest:
    name: communicationSavedPhraseSyncRequest
    in: body
    description: Bounded public saved phrases with per-record base versions
    required: true
    schema:
      $ref: "#/definitions/CommunicationSavedPhraseSyncRequest"
  CommunicationSavedPhraseDeleteRequest:
    name: communicationSavedPhraseDeleteRequest
    in: body
    description: Selected saved phrase ids, or deleteAll for an explicit full clear
    required: true
    schema:
      $ref: "#/definitions/CommunicationSavedPhraseDeleteRequest"
  User:
    name: user
    in: body
    description: User data for creating a new local user 
    required: true
    schema:
      $ref: "#/definitions/User" 
  Location:
    name: X-Forwarded-For
    in: header
    description: Contains the remote IP address of the request
    required: true
    type: array
    items:
      type: string
  Subscriber:
    name: subscriber
    in: body
    description: Subscriber data 
    required: true
    schema:
      $ref: "#/definitions/Subscriber" 
  phraseToEdit:
    name: phraseToEdit
    in: body
    description: phraseToEdit data 
    required: true
    schema:
      $ref: "#/definitions/Translate"     
paths:
  /care/migration-preview:
    x-swagger-router-controller: care
    get:
      operationId: migrationPreview
      security:
        - Bearer: []
      responses:
        '200':
          description: Read-only mapping; target profiles must be selected explicitly
        '401':
          description: Sign in again
        '503':
          description: Feature or storage unavailable
  /user/sessions:
    x-swagger-router-controller: deviceSessions
    get:
      operationId: listDeviceSessions
      security:
        - Bearer: []
      parameters:
        - name: since
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
    post:
      operationId: revokeDeviceSessions
      security:
        - Bearer: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
  /care/families:
    x-swagger-router-controller: care
    get:
      operationId: listFamilies
      security:
        - Bearer: []
      parameters:
        - name: since
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
    post:
      operationId: createFamily
      security:
        - Bearer: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
  /care/profiles:
    x-swagger-router-controller: care
    get:
      operationId: listProfiles
      security:
        - Bearer: []
      parameters:
        - name: since
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
    post:
      operationId: createProfile
      security:
        - Bearer: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
  /care/invitations/accept:
    x-swagger-router-controller: care
    post:
      operationId: acceptInvitation
      security:
        - Bearer: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
  /care/profiles/{profileId}:
    x-swagger-router-controller: care
    get:
      operationId: getProfile
      security:
        - Bearer: []
      parameters:
        - name: profileId
          in: path
          type: string
          required: true
        - name: since
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
  /care/profiles/{profileId}/commands:
    x-swagger-router-controller: care
    post:
      operationId: command
      security:
        - Bearer: []
      parameters:
        - name: profileId
          in: path
          type: string
          required: true
        - name: body
          in: body
          required: true
          schema:
            type: object
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
  /care/profiles/{profileId}/audit:
    x-swagger-router-controller: care
    get:
      operationId: getAudit
      security:
        - Bearer: []
      parameters:
        - name: profileId
          in: path
          type: string
          required: true
        - name: since
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
  /care/profiles/{profileId}/media:
    x-swagger-router-controller: care
    post:
      operationId: uploadMedia
      security:
        - Bearer: []
      parameters:
        - name: profileId
          in: path
          type: string
          required: true
        - name: body
          in: body
          required: true
          schema:
            type: object
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
  /care/profiles/{profileId}/media/{mediaId}:
    x-swagger-router-controller: care
    get:
      operationId: getMedia
      security:
        - Bearer: []
      parameters:
        - name: profileId
          in: path
          type: string
          required: true
        - name: mediaId
          in: path
          type: string
          required: true
        - name: since
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
    delete:
      operationId: deleteMedia
      security:
        - Bearer: []
      parameters:
        - name: profileId
          in: path
          type: string
          required: true
        - name: mediaId
          in: path
          type: string
          required: true
        - name: since
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Authorized result
        '400':
          description: Invalid input
        '401':
          description: Sign in again
        '403':
          description: Access revoked or denied
        '409':
          description: Version conflict or concurrent change; retain local edit
        '503':
          description: Storage or feature unavailable
  /swagger:
    x-swagger-pipe: swagger_raw
  /health:
    x-swagger-router-controller: health
    get:
      operationId: getHealth
      description: Reports whether the API can reach MongoDB and has the unique indexes required for communication synchronization.
      responses:
        "200":
          description: API and database are ready; optional capability states are included
          schema:
            $ref: "#/definitions/ServiceHealth"
        "503":
          description: API is running but the database is not ready
          schema:
            $ref: "#/definitions/ServiceHealth"
  /analytics/batchGet:
    x-swagger-router-controller: analytics
    post:
      operationId: batchGet
      description: Returns analytics reporting information based on metrics and dimensions
      security:
        - Bearer: []
      x-security-scopes:
        - admin
        - user
      parameters:
        - $ref: '#/parameters/AnalyticsReport'
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/AnalyticsReportResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /analytics/userActivity/{id}:
    x-swagger-router-controller: analytics
    post:
      operationId: userActivity
      description: Returns analytics User Activity data.
      parameters:
        - name: id
          type: string
          in: path
          required: true
          minimum: 1
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/GeneralResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /board:
    x-swagger-router-controller: board
    post:
      operationId: createBoard
      description: >-
        Creates a board. A regular user's board is always assigned to the
        authenticated email; admins may create a board for another user.
      security:
        - Bearer: []
      x-security-scopes:
        - admin
        - user
      parameters:
        - $ref: '#/parameters/Board'
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/BoardResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
    get:
      operationId: listBoard
      description: Returns the full boards list.
      parameters:
        - $ref: "#/parameters/PageParameter"
        - $ref: "#/parameters/LimitParameter"
        - $ref: "#/parameters/OffsetParameter"
        - $ref: "#/parameters/SortParameter"
        - $ref: "#/parameters/SearchParameter"
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/GetBoardListResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /board/byids:
    x-swagger-router-controller: board
    post:
      operationId: getBoardsByIds
      description: >-
        Returns the full boards matching the provided ids. Non-admin users only
        receive boards they own. Invalid ids are ignored.
      security:
        - Bearer: []
      x-security-scopes:
        - admin
        - user
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/BoardsByIdsRequest"
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/GetBoardsByIdsResponse"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /board/{id}:
    x-swagger-router-controller: board
    get:
      operationId: getBoard
      description: Returns a specific board
      parameters:
        - name: id
          type: string
          in: path
          required: true
          minimum: 1
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/GetBoardResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
    put:
      operationId: updateBoard
      description: >-
        Updates a board owned by the authenticated user. Admins may update any
        board, including its ownership email.
      security:
        - Bearer: []
      x-security-scopes:
        - admin
        - user
      parameters:
        - name: id
          description: Board Id
          type: string
          in: path
          required: true
          minimum: 1
        - name: info
          description: Board properties
          in: body
          required: true
          schema:
            $ref: "#/definitions/Board"
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/GetBoardResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
    delete:
      operationId: deleteBoard
      description: >-
        Deletes a board owned by the authenticated user. Admins may delete any
        board.
      security:
        - Bearer: []
      x-security-scopes:
        - admin
        - user
      parameters:
        - name: id
          description: Board id
          type: string
          in: path
          required: true
          minimum: 1
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/GetBoardResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /board/byemail/{email}:
    x-swagger-router-controller: board
    get:
      operationId: getBoardsEmail
      description: Returns boards for a specific user email
      security:
        - Bearer: []
      x-security-scopes:
        - admin
        - user
      parameters:
        - $ref: "#/parameters/PageParameter"
        - $ref: "#/parameters/LimitParameter"
        - $ref: "#/parameters/OffsetParameter"
        - $ref: "#/parameters/SortParameter"
        - $ref: "#/parameters/SearchParameter"
        - name: email
          type: string
          in: path
          required: true
          minimum: 1
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/GetBoardListResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /board/sync/{email}:
    x-swagger-router-controller: board
    get:
      operationId: getBoardsSync
      description: >-
        Returns a lightweight list ({ id, lastEdited }) of every board for a
        user email. Meant for sync: the client compares against its local copy
        and fetches only changed boards via GET /board/{id}.
      security:
        - Bearer: []
      x-security-scopes:
        - admin
        - user
      parameters:
        - name: email
          type: string
          in: path
          required: true
          minimum: 1
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/GetBoardsSyncResponse"
        "403":
          description: Not authorized
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /board/public:
    x-swagger-router-controller: board
    get:
      operationId: getPublicBoards
      description: Returns all public boards for all users
      parameters:
        - $ref: "#/parameters/PageParameter"
        - $ref: "#/parameters/LimitParameter"
        - $ref: "#/parameters/OffsetParameter"
        - $ref: "#/parameters/SortParameter"
        - $ref: "#/parameters/SearchParameter"
      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/GetBoardListResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /board/public/{id}/bundle:
    x-swagger-router-controller: board
    get:
      operationId: getPublicBoardBundle
      description: Returns one public board and only its publicly reachable linked boards, without owner email addresses.
      parameters:
        - name: id
          type: string
          in: path
          required: true
          minLength: 24
          maxLength: 24
          pattern: '^[a-fA-F0-9]{24}$'
      responses:
        "200":
          description: A bounded public board bundle with explicit licensing and availability warnings.
          schema:
            $ref: "#/definitions/PublicBoardBundleResponse"
        "404":
          description: The root board does not exist or is not public.
          schema:
            $ref: "#/definitions/ErrorResponse"
        "413":
          description: The public board graph exceeds the safe board or tile limit.
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /board/public/{id}/tile/{tileId}/image:
    x-swagger-router-controller: board
    get:
      operationId: getPublicBoardTileImage
      description: Returns a normalized PNG only when the public board tile image uses a configured CBoard image host.
      produces:
        - image/png
      parameters:
        - name: id
          type: string
          in: path
          required: true
          minLength: 24
          maxLength: 24
          pattern: '^[a-fA-F0-9]{24}$'
        - name: tileId
          type: string
          in: path
          required: true
          minLength: 1
          maxLength: 120
          pattern: '^[^/]+$'
      responses:
        "200":
          description: A validated public board image normalized to PNG.
          schema:
            type: string
            format: binary
        "404":
          description: The public board, tile, or image does not exist.
          schema:
            $ref: "#/definitions/ErrorResponse"
        "422":
          description: The image host is outside the configured CBoard image allowlist.
          schema:
            $ref: "#/definitions/ErrorResponse"
        "502":
          description: The upstream image could not be downloaded or normalized.
          schema:
            $ref: "#/definitions/ErrorResponse"
